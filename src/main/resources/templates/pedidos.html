<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
        <a th:href="@{/pedidos/novo}" class="btn btn-primary" th:if="${podeRegistrarPedidos}">
            <i class="bi bi-plus-lg me-1"></i> Novo Pedido
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <!-- Filtro por status -->
    <form th:action="@{/pedidos}" method="get" class="row g-2 align-items-end mb-3">
        <div class="col-auto">
            <label for="status" class="form-label small mb-0">Status</label>
            <select id="status" name="status" class="form-select form-select-sm">
                <option value="">Todos</option>
                <option th:each="s : ${statusOpcoes}" th:value="${s.name()}" th:text="${s.descricao}"
                        th:selected="${s.name() == statusFiltro}"></option>
            </select>
        </div>
        <div class="col-auto">
            <button type="submit" class="btn btn-sm btn-outline-primary"><i class="bi bi-funnel"></i> Filtrar</button>
        </div>
    </form>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Pedido</th>
                        <th>Cliente</th>
                        <th>Tipo</th>
                        <th>Itens</th>
                        <th class="text-end">Total</th>
                        <th>Status</th>
                        <th>Entrada</th>
                        <th>Registrado por</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted"
                            th:text="${#strings.length(pedido.id) > 6} ? ('#' + ${#strings.substring(pedido.id, #strings.length(pedido.id) - 6)}) : ${pedido.id}"></td>
                        <td th:text="${pedido.clienteNome != null} ? ${pedido.clienteNome} : ${pedido.clienteId}"></td>
                        <td th:text="${pedido.tipoEntrega != null} ? ${pedido.tipoEntrega.descricao} : '—'"></td>
                        <td th:text="${pedido.itens != null} ? ${#lists.size(pedido.itens)} : 0"></td>
                        <td class="text-end"
                            th:text="${pedido.valorTotal != null} ? ('R$ ' + ${#numbers.formatDecimal(pedido.valorTotal, 1, 'POINT', 2, 'COMMA')}) : '—'"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${statusCores[pedido.status]} ?: 'bg-secondary'"
                                  th:text="${statusDescricoes[pedido.status]} ?: ${pedido.status}">
                            </span>
                        </td>
                        <td th:text="${@fmt.dataHoraCurta(pedido.dataHoraEntrada)}"></td>
                        <td th:text="${pedido.registradoPor}"></td>
                        <td class="text-end pe-4">
                            <a th:href="@{/pedidos/{id}(id=${pedido.id})}" class="btn btn-sm btn-outline-primary">
                                <i class="bi bi-eye"></i> Abrir
                            </a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

</body>
</html>
