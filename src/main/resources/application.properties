# ---------------------------------------------------------------------------
# PediuPatrão - configuração
# NENHUMA credencial fica neste arquivo. Use variáveis de ambiente (ou um arquivo .env local,
# ignorado pelo Git, baseado em .env.example).
# ---------------------------------------------------------------------------

# Carrega um arquivo .env opcional da pasta de execução (formato CHAVE=valor)
spring.config.import=optional:file:.env[.properties]

# MongoDB (obrigatório em produção; o padrão abaixo é apenas para desenvolvimento local)
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017}
spring.data.mongodb.database=${MONGODB_DATABASE:pizzaria}

# Transações do MongoDB (exigem replica set, ex.: MongoDB Atlas). Em MongoDB standalone, mantenha false:
# nesse caso a consistência com a auditoria é garantida por compensação (a operação é desfeita se a
# auditoria não puder ser gravada).
pediupatrao.mongodb.transacoes=${MONGODB_TRANSACOES:false}

# Fuso horário usado nos horários de entrada, saída e auditoria
pediupatrao.timezone=${PEDIU_TIMEZONE:America/Sao_Paulo}

# Usuário administrador inicial (criado somente se não existir nenhum ADMIN e a senha for informada)
pediupatrao.admin.username=${PEDIU_ADMIN_USERNAME:admin}
pediupatrao.admin.password=${PEDIU_ADMIN_PASSWORD:}

# Usuários de demonstração (gerente01 / atendente01): desabilitado por padrão
pediupatrao.seed.enabled=${PEDIU_SEED_ENABLED:false}
pediupatrao.seed.gerente-password=${PEDIU_SEED_GERENTE_PASSWORD:}
pediupatrao.seed.atendente-password=${PEDIU_SEED_ATENDENTE_PASSWORD:}

# Thymeleaf
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Não expor detalhes de exceções nas páginas/respostas de erro
server.error.include-message=never
server.error.include-stacktrace=never

logging.level.com.umc.pediupatrao=INFO
