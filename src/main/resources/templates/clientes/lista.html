<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Clientes</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-person-raised-hand me-2 text-primary"></i>Clientes
        </h2>
        <a th:href="@{/clientes/novo}" class="btn btn-primary" th:if="${podeEditarClientes}">
            <i class="bi bi-plus-lg me-1"></i> Novo Cliente
        </a>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div id="clientes-erro" class="alert alert-danger d-none" role="alert"></div>

    <!-- Tabela de clientes -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Nome</th>
                        <th>Telefone</th>
                        <th>Endereço</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody id="clientes-tabela"
                       th:attr="data-editar=${podeEditarClientes}, data-excluir=${podeExcluirClientes}">
                    <!-- Linhas carregadas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <script>
        const API_URL = '/api/clientes';
        const tabelaClientes = document.getElementById('clientes-tabela');
        const podeEditar = tabelaClientes.dataset.editar === 'true';
        const podeExcluir = tabelaClientes.dataset.excluir === 'true';

        function mostrarErro(mensagem) {
            const caixa = document.getElementById('clientes-erro');
            caixa.textContent = mensagem;
            caixa.classList.remove('d-none');
        }

        function formatarEndereco(cliente) {
            const partes = [
                cliente.logradouro,
                cliente.numero,
                cliente.complemento,
                cliente.bairro,
                cliente.cidade,
                cliente.estado
            ].filter(p => p && p.trim() !== '');

            return partes.length > 0 ? partes.join(', ') : (cliente.endereco || '—');
        }

        async function lerMensagemErro(response, padrao) {
            try {
                const corpo = await response.json();
                return corpo.mensagem || padrao;
            } catch (e) {
                return response.status === 403 ? 'Você não tem permissão para esta operação.' : padrao;
            }
        }

        async function carregarClientes() {
            const response = await fetch(API_URL, { headers: { 'Accept': 'application/json' } });
            if (!response.ok) {
                mostrarErro(await lerMensagemErro(response, 'Não foi possível carregar os clientes.'));
                return;
            }
            const clientes = await response.json();
            tabelaClientes.innerHTML = '';

            if (clientes.length === 0) {
                tabelaClientes.innerHTML = `
                    <tr>
                        <td colspan="4" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum cliente cadastrado.
                        </td>
                    </tr>`;
                return;
            }

            clientes.forEach(cliente => {
                const row = document.createElement('tr');
                const botaoEditar = podeEditar ? `
                        <a href="/clientes/editar/${encodeURIComponent(cliente.id)}" class="btn btn-sm btn-outline-primary me-1">
                            <i class="bi bi-pencil-fill"></i> Editar
                        </a>` : '';
                const botaoExcluir = podeExcluir ? `
                        <button class="btn btn-sm btn-outline-danger" data-id="${escapeHtml(cliente.id)}">
                            <i class="bi bi-trash-fill"></i> Excluir
                        </button>` : '';
                row.innerHTML = `
                    <td>${escapeHtml(cliente.nome || '—')}</td>
                    <td>${escapeHtml(cliente.telefone || '—')}</td>
                    <td>${escapeHtml(formatarEndereco(cliente))}</td>
                    <td class="text-end pe-4">${botaoEditar}${botaoExcluir}</td>
                `;
                const excluir = row.querySelector('button[data-id]');
                if (excluir) {
                    excluir.addEventListener('click', () => excluirCliente(cliente.id));
                }
                tabelaClientes.appendChild(row);
            });
        }

        async function excluirCliente(id) {
            if (confirm('Tem certeza que deseja excluir este cliente?')) {
                const response = await fetch(`${API_URL}/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: csrfHeaders({ 'Accept': 'application/json' })
                });
                if (response.ok) {
                    carregarClientes();
                } else {
                    mostrarErro(await lerMensagemErro(response, 'Erro ao excluir o cliente.'));
                }
            }
        }

        carregarClientes();
    </script>
</div>
</body>
</html>
